[project]
name = "belen-pilates-mvp"
version = "0.1.0"
description = "Aplicación local de gestión para una escuela de pilates"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.17,<2",
    "fastapi>=0.121,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.38,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.uv]
package = false

